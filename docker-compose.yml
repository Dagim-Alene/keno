version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       keno
      POSTGRES_USER:     keno_user
      POSTGRES_PASSWORD: keno_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keno_user -d keno"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
